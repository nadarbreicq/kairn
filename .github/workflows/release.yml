name: Publication

# Publier une version : monter `version` (et `android.versionCode`) dans
# apps/mobile/app.json, commiter, puis pousser le tag correspondant :
#   git tag v0.9.5 && git push origin v0.9.5
#
# La release part en préversion : seules les apps où « Inclure les
# préversions » est coché la proposent. Une fois essayée, la passer en
# version stable, proposée à tout le monde :
#   gh release edit v0.9.5 --prerelease=false --latest

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: APK signé et release GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Par défaut l'action installe aussi « tools », paquet retiré des
          # dépôts Google : l'installation échoue. Gradle télécharge seul
          # la plateforme et les build-tools dont le projet a besoin.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4

      - name: Vérifier que le tag correspond à la version de l'app
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version $VERSION d'apps/mobile/app.json."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Sans la clé Kairn, Android refuserait l'APK comme mise à jour des
      # versions déjà installées : mieux vaut ne rien publier.
      - name: Installer la clé de signature
        env:
          KAIRN_KEYSTORE_BASE64: ${{ secrets.KAIRN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KAIRN_KEYSTORE_BASE64" ]; then
            echo "Secret KAIRN_KEYSTORE_BASE64 absent : publication impossible sans la clé Kairn."
            exit 1
          fi
          echo "$KAIRN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kairn-release.jks"
          echo "KAIRN_KEYSTORE_FILE=$RUNNER_TEMP/kairn-release.jks" >> "$GITHUB_ENV"

      - name: Compiler l'APK signé
        run: npm run mobile:apk
        env:
          KAIRN_KEYSTORE_PASSWORD: ${{ secrets.KAIRN_KEYSTORE_PASSWORD }}
          KAIRN_KEY_ALIAS: ${{ secrets.KAIRN_KEY_ALIAS }}
          KAIRN_KEY_PASSWORD: ${{ secrets.KAIRN_KEY_PASSWORD }}

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="kairn-$VERSION.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --title "Kairn $VERSION" --generate-notes --prerelease

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/kairn-release.jks"
