name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Lint et tests (core, Kairn Desk, mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck --workspace apps/mobile

  android-build:
    name: Mobile — APK debug (Gradle, la même commande qu'en local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci
      - run: npm run build --workspace @kairn/core
      # Génère les projets natifs android/ (non versionnés, voir .gitignore) —
      # la même étape que sur un poste de développement avant `./gradlew`.
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - name: Compiler l'APK debug
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kairn-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
