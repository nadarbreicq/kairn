name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Lint et tests (core, Kairn Desk, mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck --workspace apps/mobile

  android-build:
    name: Mobile — APK installable (Gradle, la même commande qu'en local)
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      # Garantit un SDK Android complet avec les licences déjà acceptées,
      # plutôt que de dépendre de ce que l'image ubuntu-latest embarque par
      # défaut (ça change avec le temps, et l'acceptation des licences est
      # la cause la plus fréquente d'échec au premier essai en CI).
      - uses: android-actions/setup-android@v3
        with:
          # Par défaut l'action installe aussi « tools », paquet retiré des
          # dépôts Google : l'installation échoue. Gradle télécharge seul
          # la plateforme et les build-tools dont le projet a besoin.
          packages: 'platform-tools'
      # Cache les dépendances Gradle entre les exécutions : la première
      # compilation reste longue, les suivantes sont nettement plus rapides.
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      # Même script qu'en local (apps/mobile/scripts/build-apk.mjs) : génère
      # le projet natif android/ (non versionné, voir .gitignore) puis compile
      # la variante release, code JS embarqué — l'APK fonctionne donc seul
      # sur le téléphone, sans serveur de développement.
      - run: npm run mobile:apk
      - uses: actions/upload-artifact@v4
        with:
          name: kairn-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
