name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Lint et tests (core, Kairn Desk, mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck --workspace apps/mobile

  android-build:
    name: Mobile — APK debug (Gradle, la même commande qu'en local)
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # Garantit un SDK Android complet avec les licences déjà acceptées,
      # plutôt que de dépendre de ce que l'image ubuntu-latest embarque par
      # défaut (ça change avec le temps, et l'acceptation des licences est
      # la cause la plus fréquente d'échec au premier essai en CI).
      - uses: android-actions/setup-android@v3
      # Cache les dépendances Gradle entre les exécutions : la première
      # compilation reste longue, les suivantes sont nettement plus rapides.
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build --workspace @kairn/core
      # Génère le projet natif android/ (non versionné, voir .gitignore) —
      # la même étape que sur un poste de développement avant `./gradlew`.
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - name: Compiler l'APK debug
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kairn-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
